name: Publish CS Docker image

# Fork-only workflow. Builds the Czech-enabled image and pushes it to GHCR.
# Runs on release tags (v<upstream>-cs.<n>) only, never on branch pushes, and
# never tags :latest — the deploy repo always pins an explicit tag.

on:
  push:
    tags:
      - 'v*-cs.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build_and_publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          # Immutable tags only. Never :latest.
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.image.outputs.name }}:${{ github.ref_name }}"
            echo "${{ steps.image.outputs.name }}:${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
